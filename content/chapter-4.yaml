chapter: 4
questions:
  - id: "CTFL-C4-K2-01-A"
    revision: 1
    variant: "A"
    language: "en"
    stem: [{ kind: "paragraph", text: "Why can one test value normally represent an entire valid equivalence partition?" }]
    options:
      - { id: "A", content: [{ kind: "paragraph", text: "All values in the partition are expected to be processed in the same way" }] }
      - { id: "B", content: [{ kind: "paragraph", text: "The partition always contains only one possible value" }] }
      - { id: "C", content: [{ kind: "paragraph", text: "Every value in the partition is a boundary value" }] }
      - { id: "D", content: [{ kind: "paragraph", text: "Equivalence partitioning proves there are no internal defects" }] }
    interaction: { kind: "singleChoice", requiredSelections: 1 }
    classification: { chapter: 4, section: "4.2 Black-box Test Techniques", learningObjective: "FL-4.2.1", blueprintBucket: "C4-K2-01", kLevel: "K2", styleTags: ["directKnowledge"] }
    shuffleOptions: true
    provenance: &original { kind: "original", authoringNote: "Independently written for this practice bank without copying source questions.", rightsStatus: "cleared" }
    verification: &verified { answerStatus: "verified", reviewedAgainst: "ISTQB CTFL Syllabus v4.0.1", reviewedAt: "2026-08-29", reviewer: "CTFL content review" }
    solution:
      correctOptionIds: ["A"]
      explanation: [{ kind: "paragraph", text: "Equivalence partitions group values expected to receive equivalent processing, allowing a representative to test the shared behavior." }]
      references: [{ title: "ISTQB Certified Tester Foundation Level Syllabus", version: "4.0.1", locator: "FL-4.2.1", url: "https://istqb.org/certifications/certified-tester-foundation-level-ctfl-v4-0/" }]

  - id: "CTFL-C4-K2-01-B"
    revision: 1
    variant: "B"
    language: "en"
    stem: [{ kind: "paragraph", text: "What distinguishes boundary value analysis from equivalence partitioning?" }]
    options:
      - { id: "A", content: [{ kind: "paragraph", text: "It focuses test values at the edges of ordered partitions" }] }
      - { id: "B", content: [{ kind: "paragraph", text: "It can be applied only to source code" }] }
      - { id: "C", content: [{ kind: "paragraph", text: "It requires every possible value to be tested" }] }
      - { id: "D", content: [{ kind: "paragraph", text: "It models only invalid inputs" }] }
    interaction: { kind: "singleChoice", requiredSelections: 1 }
    classification: { chapter: 4, section: "4.2 Black-box Test Techniques", learningObjective: "FL-4.2.2", blueprintBucket: "C4-K2-01", kLevel: "K2", styleTags: ["directKnowledge"] }
    shuffleOptions: true
    provenance: *original
    verification: *verified
    solution:
      correctOptionIds: ["A"]
      explanation: [{ kind: "paragraph", text: "Boundary value analysis targets values on and next to boundaries because implementation mistakes are common at partition edges." }]
      references: [{ title: "ISTQB Certified Tester Foundation Level Syllabus", version: "4.0.1", locator: "FL-4.2.2", url: "https://istqb.org/certifications/certified-tester-foundation-level-ctfl-v4-0/" }]

  - id: "CTFL-C4-K2-02-A"
    revision: 1
    variant: "A"
    language: "en"
    stem: [{ kind: "paragraph", text: "A benefit depends on combinations of account type, residency, and purchase amount. Which technique best organizes the combinations and expected actions?" }]
    options:
      - { id: "A", content: [{ kind: "paragraph", text: "Decision table testing" }] }
      - { id: "B", content: [{ kind: "paragraph", text: "Statement testing" }] }
      - { id: "C", content: [{ kind: "paragraph", text: "Error guessing" }] }
      - { id: "D", content: [{ kind: "paragraph", text: "Checklist-based testing" }] }
    interaction: { kind: "singleChoice", requiredSelections: 1 }
    classification: { chapter: 4, section: "4.2 Black-box Test Techniques", learningObjective: "FL-4.2.3", blueprintBucket: "C4-K2-02", kLevel: "K2", styleTags: ["scenario", "BEST"] }
    shuffleOptions: true
    provenance: *original
    verification: *verified
    solution:
      correctOptionIds: ["A"]
      explanation: [{ kind: "paragraph", text: "Decision tables show combinations of conditions and their resulting actions, making complex business rules systematic and visible." }]
      references: [{ title: "ISTQB Certified Tester Foundation Level Syllabus", version: "4.0.1", locator: "FL-4.2.3", url: "https://istqb.org/certifications/certified-tester-foundation-level-ctfl-v4-0/" }]

  - id: "CTFL-C4-K2-02-B"
    revision: 1
    variant: "B"
    language: "en"
    stem: [{ kind: "paragraph", text: "A media player reacts differently to Play depending on whether it is Stopped, Paused, or already Playing. Which technique is most suitable?" }]
    options:
      - { id: "A", content: [{ kind: "paragraph", text: "Equivalence partitioning" }] }
      - { id: "B", content: [{ kind: "paragraph", text: "State transition testing" }] }
      - { id: "C", content: [{ kind: "paragraph", text: "Branch testing" }] }
      - { id: "D", content: [{ kind: "paragraph", text: "Checklist-based testing" }] }
    interaction: { kind: "singleChoice", requiredSelections: 1 }
    classification: { chapter: 4, section: "4.2 Black-box Test Techniques", learningObjective: "FL-4.2.4", blueprintBucket: "C4-K2-02", kLevel: "K2", styleTags: ["scenario", "MOST"] }
    shuffleOptions: true
    provenance: *original
    verification: *verified
    solution:
      correctOptionIds: ["B"]
      explanation: [{ kind: "paragraph", text: "State transition testing models behavior in response to events, including how the current state changes the result." }]
      references: [{ title: "ISTQB Certified Tester Foundation Level Syllabus", version: "4.0.1", locator: "FL-4.2.4", url: "https://istqb.org/certifications/certified-tester-foundation-level-ctfl-v4-0/" }]

  - id: "CTFL-C4-K2-03-A"
    revision: 1
    variant: "A"
    language: "en"
    stem: [{ kind: "paragraph", text: "A test suite achieves 100% branch coverage. What can be concluded about statement coverage for the same code?" }]
    options:
      - { id: "A", content: [{ kind: "paragraph", text: "It must also be 100%" }] }
      - { id: "B", content: [{ kind: "paragraph", text: "It must be exactly 50%" }] }
      - { id: "C", content: [{ kind: "paragraph", text: "It cannot be measured" }] }
      - { id: "D", content: [{ kind: "paragraph", text: "It is always lower than branch coverage" }] }
    interaction: { kind: "singleChoice", requiredSelections: 1 }
    classification: { chapter: 4, section: "4.3 White-box Test Techniques", learningObjective: "FL-4.3.3", blueprintBucket: "C4-K2-03", kLevel: "K2", styleTags: ["directKnowledge", "TRUE"] }
    shuffleOptions: true
    provenance: *original
    verification: *verified
    solution:
      correctOptionIds: ["A"]
      explanation: [{ kind: "paragraph", text: "Exercising every branch necessarily executes every reachable statement, so 100% branch coverage subsumes 100% statement coverage." }]
      references: [{ title: "ISTQB Certified Tester Foundation Level Syllabus", version: "4.0.1", locator: "FL-4.3.3", url: "https://istqb.org/certifications/certified-tester-foundation-level-ctfl-v4-0/" }]

  - id: "CTFL-C4-K2-03-B"
    revision: 1
    variant: "B"
    language: "en"
    stem: [{ kind: "paragraph", text: "Why is structural coverage information useful after specification-based tests have run?" }]
    options:
      - { id: "A", content: [{ kind: "paragraph", text: "It can expose code elements that the tests did not exercise" }] }
      - { id: "B", content: [{ kind: "paragraph", text: "It proves every requirement is correct" }] }
      - { id: "C", content: [{ kind: "paragraph", text: "It automatically fixes uncovered branches" }] }
      - { id: "D", content: [{ kind: "paragraph", text: "It replaces the need to define expected results" }] }
    interaction: { kind: "singleChoice", requiredSelections: 1 }
    classification: { chapter: 4, section: "4.3 White-box Test Techniques", learningObjective: "FL-4.3.3", blueprintBucket: "C4-K2-03", kLevel: "K2", styleTags: ["directKnowledge", "BEST"] }
    shuffleOptions: true
    provenance: *original
    verification: *verified
    solution:
      correctOptionIds: ["A"]
      explanation: [{ kind: "paragraph", text: "Coverage measurements identify unexercised structural elements, which can prompt additional tests and reveal gaps in the suite." }]
      references: [{ title: "ISTQB Certified Tester Foundation Level Syllabus", version: "4.0.1", locator: "FL-4.3.3", url: "https://istqb.org/certifications/certified-tester-foundation-level-ctfl-v4-0/" }]

  - id: "CTFL-C4-K2-04-A"
    revision: 1
    variant: "A"
    language: "en"
    stem: [{ kind: "paragraph", text: "A tester remembers that earlier products often failed when files were empty or names ended with a space, so those inputs are tried first. Which technique is being used?" }]
    options:
      - { id: "A", content: [{ kind: "paragraph", text: "Decision table testing" }] }
      - { id: "B", content: [{ kind: "paragraph", text: "Error guessing" }] }
      - { id: "C", content: [{ kind: "paragraph", text: "Statement testing" }] }
      - { id: "D", content: [{ kind: "paragraph", text: "Boundary value analysis only" }] }
    interaction: { kind: "singleChoice", requiredSelections: 1 }
    classification: { chapter: 4, section: "4.4 Experience-based Test Techniques", learningObjective: "FL-4.4.1", blueprintBucket: "C4-K2-04", kLevel: "K2", styleTags: ["scenario"] }
    shuffleOptions: true
    provenance: *original
    verification: *verified
    solution:
      correctOptionIds: ["B"]
      explanation: [{ kind: "paragraph", text: "Error guessing uses tester knowledge and experience of likely errors, defects, and failures to devise targeted tests." }]
      references: [{ title: "ISTQB Certified Tester Foundation Level Syllabus", version: "4.0.1", locator: "FL-4.4.1", url: "https://istqb.org/certifications/certified-tester-foundation-level-ctfl-v4-0/" }]

  - id: "CTFL-C4-K2-04-B"
    revision: 1
    variant: "B"
    language: "en"
    stem: [{ kind: "paragraph", text: "Which input is most characteristic of error guessing for a date field?" }]
    options:
      - { id: "A", content: [{ kind: "paragraph", text: "A date chosen because a past system incorrectly accepted 29 February in a non-leap year" }] }
      - { id: "B", content: [{ kind: "paragraph", text: "Every date listed in the requirements" }] }
      - { id: "C", content: [{ kind: "paragraph", text: "A date selected only to execute a particular code statement" }] }
      - { id: "D", content: [{ kind: "paragraph", text: "A random date with no testing rationale" }] }
    interaction: { kind: "singleChoice", requiredSelections: 1 }
    classification: { chapter: 4, section: "4.4 Experience-based Test Techniques", learningObjective: "FL-4.4.1", blueprintBucket: "C4-K2-04", kLevel: "K2", styleTags: ["scenario", "MOST"] }
    shuffleOptions: true
    provenance: *original
    verification: *verified
    solution:
      correctOptionIds: ["A"]
      explanation: [{ kind: "paragraph", text: "The selection is driven by knowledge of a recurring date-handling failure, which is the defining basis of error guessing." }]
      references: [{ title: "ISTQB Certified Tester Foundation Level Syllabus", version: "4.0.1", locator: "FL-4.4.1", url: "https://istqb.org/certifications/certified-tester-foundation-level-ctfl-v4-0/" }]

  - id: "CTFL-C4-K2-05-A"
    revision: 1
    variant: "A"
    language: "en"
    stem: [{ kind: "paragraph", text: "A tester learns a new reporting feature while designing and executing tests in uninterrupted 60-minute sessions. Findings guide the next tests. What approach is this?" }]
    options:
      - { id: "A", content: [{ kind: "paragraph", text: "Exploratory testing" }] }
      - { id: "B", content: [{ kind: "paragraph", text: "Exhaustive testing" }] }
      - { id: "C", content: [{ kind: "paragraph", text: "Statement testing" }] }
      - { id: "D", content: [{ kind: "paragraph", text: "Formal inspection" }] }
    interaction: { kind: "singleChoice", requiredSelections: 1 }
    classification: { chapter: 4, section: "4.4 Experience-based Test Techniques", learningObjective: "FL-4.4.2", blueprintBucket: "C4-K2-05", kLevel: "K2", styleTags: ["scenario"] }
    shuffleOptions: true
    provenance: *original
    verification: *verified
    solution:
      correctOptionIds: ["A"]
      explanation: [{ kind: "paragraph", text: "Exploratory testing integrates learning, test design, and execution; session-based testing can provide time-boxed structure and reporting." }]
      references: [{ title: "ISTQB Certified Tester Foundation Level Syllabus", version: "4.0.1", locator: "FL-4.4.2", url: "https://istqb.org/certifications/certified-tester-foundation-level-ctfl-v4-0/" }]

  - id: "CTFL-C4-K2-05-B"
    revision: 1
    variant: "B"
    language: "en"
    stem: [{ kind: "paragraph", text: "When is checklist-based testing particularly useful?" }]
    options:
      - { id: "A", content: [{ kind: "paragraph", text: "When a reusable list of important conditions can guide consistent coverage" }] }
      - { id: "B", content: [{ kind: "paragraph", text: "When expected results must never be considered" }] }
      - { id: "C", content: [{ kind: "paragraph", text: "When every code branch is already impossible to identify" }] }
      - { id: "D", content: [{ kind: "paragraph", text: "When the goal is to test every input combination" }] }
    interaction: { kind: "singleChoice", requiredSelections: 1 }
    classification: { chapter: 4, section: "4.4 Experience-based Test Techniques", learningObjective: "FL-4.4.3", blueprintBucket: "C4-K2-05", kLevel: "K2", styleTags: ["directKnowledge", "BEST"] }
    shuffleOptions: true
    provenance: *original
    verification: *verified
    solution:
      correctOptionIds: ["A"]
      explanation: [{ kind: "paragraph", text: "A checklist captures experience, standards, and known concerns in a reusable form while still allowing the tester judgment in applying each item." }]
      references: [{ title: "ISTQB Certified Tester Foundation Level Syllabus", version: "4.0.1", locator: "FL-4.4.3", url: "https://istqb.org/certifications/certified-tester-foundation-level-ctfl-v4-0/" }]

  - id: "CTFL-C4-K2-06-A"
    revision: 1
    variant: "A"
    language: "en"
    stem: [{ kind: "paragraph", text: "Which acceptance criterion is written in a scenario-oriented format?" }]
    options:
      - { id: "A", content: [{ kind: "paragraph", text: "Given an authenticated customer, when checkout succeeds, then an order number is displayed" }] }
      - { id: "B", content: [{ kind: "paragraph", text: "The checkout should probably feel fast" }] }
      - { id: "C", content: [{ kind: "paragraph", text: "Developers will choose any suitable behavior" }] }
      - { id: "D", content: [{ kind: "paragraph", text: "The order feature has many requirements" }] }
    interaction: { kind: "singleChoice", requiredSelections: 1 }
    classification: { chapter: 4, section: "4.5 Collaboration-based Test Approaches", learningObjective: "FL-4.5.1", blueprintBucket: "C4-K2-06", kLevel: "K2", styleTags: ["scenario"] }
    shuffleOptions: true
    provenance: *original
    verification: *verified
    solution:
      correctOptionIds: ["A"]
      explanation: [{ kind: "paragraph", text: "The Given/When/Then form expresses a precondition, action, and observable expected result and is a scenario-oriented acceptance criterion." }]
      references: [{ title: "ISTQB Certified Tester Foundation Level Syllabus", version: "4.0.1", locator: "FL-4.5.1", url: "https://istqb.org/certifications/certified-tester-foundation-level-ctfl-v4-0/" }]

  - id: "CTFL-C4-K2-06-B"
    revision: 1
    variant: "B"
    language: "en"
    stem: [{ kind: "paragraph", text: "What is a key benefit of acceptance test-driven development?" }]
    options:
      - { id: "A", content: [{ kind: "paragraph", text: "Stakeholders collaborate on concrete examples before implementation" }] }
      - { id: "B", content: [{ kind: "paragraph", text: "It guarantees that all later regression tests are unnecessary" }] }
      - { id: "C", content: [{ kind: "paragraph", text: "It limits acceptance criteria to internal code structure" }] }
      - { id: "D", content: [{ kind: "paragraph", text: "It assigns quality responsibility only to testers" }] }
    interaction: { kind: "singleChoice", requiredSelections: 1 }
    classification: { chapter: 4, section: "4.5 Collaboration-based Test Approaches", learningObjective: "FL-4.5.2", blueprintBucket: "C4-K2-06", kLevel: "K2", styleTags: ["directKnowledge", "BEST"] }
    shuffleOptions: true
    provenance: *original
    verification: *verified
    solution:
      correctOptionIds: ["A"]
      explanation: [{ kind: "paragraph", text: "ATDD builds shared understanding through examples and acceptance tests created collaboratively before the solution is implemented." }]
      references: [{ title: "ISTQB Certified Tester Foundation Level Syllabus", version: "4.0.1", locator: "FL-4.5.2", url: "https://istqb.org/certifications/certified-tester-foundation-level-ctfl-v4-0/" }]

  - id: "CTFL-C4-K3-01-A"
    revision: 1
    variant: "A"
    language: "en"
    stem: [{ kind: "paragraph", text: "A registration rule accepts ages from 18 through 65 inclusive. Which set covers all three equivalence partitions with one value each?" }]
    options:
      - { id: "A", content: [{ kind: "paragraph", text: "17, 40, 70" }] }
      - { id: "B", content: [{ kind: "paragraph", text: "18, 40, 65" }] }
      - { id: "C", content: [{ kind: "paragraph", text: "16, 17, 18" }] }
      - { id: "D", content: [{ kind: "paragraph", text: "40, 41, 42" }] }
    interaction: { kind: "singleChoice", requiredSelections: 1 }
    classification: { chapter: 4, section: "4.2 Black-box Test Techniques", learningObjective: "FL-4.2.1", blueprintBucket: "C4-K3-01", kLevel: "K3", styleTags: ["calculation", "MINIMAL"] }
    shuffleOptions: true
    provenance: *original
    verification: *verified
    solution:
      correctOptionIds: ["A"]
      explanation: [{ kind: "paragraph", text: "The partitions are below 18, 18 through 65, and above 65. Values 17, 40, and 70 represent each one." }]
      references: [{ title: "ISTQB Certified Tester Foundation Level Syllabus", version: "4.0.1", locator: "FL-4.2.1", url: "https://istqb.org/certifications/certified-tester-foundation-level-ctfl-v4-0/" }]

  - id: "CTFL-C4-K3-01-B"
    revision: 1
    variant: "B"
    language: "en"
    stem: [{ kind: "paragraph", text: "Parcel pricing uses three weight partitions: up to 2 kg, over 2 kg through 10 kg, and over 10 kg. Which minimal set covers every partition?" }]
    options:
      - { id: "A", content: [{ kind: "paragraph", text: "1 kg, 5 kg, 12 kg" }] }
      - { id: "B", content: [{ kind: "paragraph", text: "2 kg, 3 kg, 10 kg" }] }
      - { id: "C", content: [{ kind: "paragraph", text: "4 kg, 6 kg, 8 kg" }] }
      - { id: "D", content: [{ kind: "paragraph", text: "11 kg, 12 kg, 13 kg" }] }
    interaction: { kind: "singleChoice", requiredSelections: 1 }
    classification: { chapter: 4, section: "4.2 Black-box Test Techniques", learningObjective: "FL-4.2.1", blueprintBucket: "C4-K3-01", kLevel: "K3", styleTags: ["calculation", "MINIMAL"] }
    shuffleOptions: true
    provenance: *original
    verification: *verified
    solution:
      correctOptionIds: ["A"]
      explanation: [{ kind: "paragraph", text: "One value is needed from each partition. The values 1, 5, and 12 kg cover the low, middle, and high partitions respectively." }]
      references: [{ title: "ISTQB Certified Tester Foundation Level Syllabus", version: "4.0.1", locator: "FL-4.2.1", url: "https://istqb.org/certifications/certified-tester-foundation-level-ctfl-v4-0/" }]

  - id: "CTFL-C4-K3-02-A"
    revision: 1
    variant: "A"
    language: "en"
    stem: [{ kind: "paragraph", text: "A valid customer number is any integer from 100 through 999 inclusive. Which set provides 2-value boundary value coverage?" }]
    options:
      - { id: "A", content: [{ kind: "paragraph", text: "99, 100, 999, 1000" }] }
      - { id: "B", content: [{ kind: "paragraph", text: "100, 101, 998, 999" }] }
      - { id: "C", content: [{ kind: "paragraph", text: "99, 101, 998, 1000" }] }
      - { id: "D", content: [{ kind: "paragraph", text: "100, 500, 999, 1000" }] }
    interaction: { kind: "singleChoice", requiredSelections: 1 }
    classification: { chapter: 4, section: "4.2 Black-box Test Techniques", learningObjective: "FL-4.2.2", blueprintBucket: "C4-K3-02", kLevel: "K3", styleTags: ["calculation"] }
    shuffleOptions: true
    provenance: *original
    verification: *verified
    solution:
      correctOptionIds: ["A"]
      explanation: [{ kind: "paragraph", text: "For each boundary, 2-value BVA selects the boundary value and the closest value in the adjacent partition: 99/100 and 999/1000." }]
      references: [{ title: "ISTQB Certified Tester Foundation Level Syllabus", version: "4.0.1", locator: "FL-4.2.2", url: "https://istqb.org/certifications/certified-tester-foundation-level-ctfl-v4-0/" }]

  - id: "CTFL-C4-K3-02-B"
    revision: 1
    variant: "B"
    language: "en"
    stem: [{ kind: "paragraph", text: "An order quantity must be from 1 through 20 inclusive. Which values give 3-value boundary coverage at both boundaries?" }]
    options:
      - { id: "A", content: [{ kind: "paragraph", text: "0, 1, 2, 19, 20, 21" }] }
      - { id: "B", content: [{ kind: "paragraph", text: "1, 2, 3, 18, 19, 20" }] }
      - { id: "C", content: [{ kind: "paragraph", text: "0, 1, 10, 20, 21" }] }
      - { id: "D", content: [{ kind: "paragraph", text: "1, 10, 20" }] }
    interaction: { kind: "singleChoice", requiredSelections: 1 }
    classification: { chapter: 4, section: "4.2 Black-box Test Techniques", learningObjective: "FL-4.2.2", blueprintBucket: "C4-K3-02", kLevel: "K3", styleTags: ["calculation"] }
    shuffleOptions: true
    provenance: *original
    verification: *verified
    solution:
      correctOptionIds: ["A"]
      explanation: [{ kind: "paragraph", text: "3-value BVA takes the boundary and both adjacent values: 0, 1, 2 around the lower boundary and 19, 20, 21 around the upper boundary." }]
      references: [{ title: "ISTQB Certified Tester Foundation Level Syllabus", version: "4.0.1", locator: "FL-4.2.2", url: "https://istqb.org/certifications/certified-tester-foundation-level-ctfl-v4-0/" }]

  - id: "CTFL-C4-K3-03-A"
    revision: 1
    variant: "A"
    language: "en"
    stem:
      - { kind: "paragraph", text: "A download is allowed only when the user is signed in and the document is public or the user owns it. Which condition combination should expect denial?" }
      - { kind: "table", caption: "Conditions used by the access rule", headers: ["Condition", "Values"], rows: [["Signed in", "Yes / No"], ["Document public", "Yes / No"], ["User owns document", "Yes / No"]] }
    options:
      - { id: "A", content: [{ kind: "paragraph", text: "Signed in: Yes; Public: No; Owner: Yes" }] }
      - { id: "B", content: [{ kind: "paragraph", text: "Signed in: Yes; Public: Yes; Owner: No" }] }
      - { id: "C", content: [{ kind: "paragraph", text: "Signed in: No; Public: Yes; Owner: Yes" }] }
      - { id: "D", content: [{ kind: "paragraph", text: "Signed in: Yes; Public: Yes; Owner: Yes" }] }
    interaction: { kind: "singleChoice", requiredSelections: 1 }
    classification: { chapter: 4, section: "4.2 Black-box Test Techniques", learningObjective: "FL-4.2.3", blueprintBucket: "C4-K3-03", kLevel: "K3", styleTags: ["tableOrDiagram", "scenario"] }
    shuffleOptions: true
    provenance: *original
    verification: *verified
    solution:
      correctOptionIds: ["C"]
      explanation: [{ kind: "paragraph", text: "Being signed in is mandatory. A signed-out user is denied even when the document is public and the user would otherwise be its owner." }]
      references: [{ title: "ISTQB Certified Tester Foundation Level Syllabus", version: "4.0.1", locator: "FL-4.2.3", url: "https://istqb.org/certifications/certified-tester-foundation-level-ctfl-v4-0/" }]

  - id: "CTFL-C4-K3-03-B"
    revision: 1
    variant: "B"
    language: "en"
    stem: [{ kind: "paragraph", text: "A decision table has two independent Boolean conditions, and no columns can be collapsed because each combination causes a different action. How many test cases are needed for full rule coverage?" }]
    options:
      - { id: "A", content: [{ kind: "paragraph", text: "2" }] }
